# ======================================================================
# Portal DZI — wewnętrzny portal kafelkowy departamentu DZI.
# Autor: Maciej Myśliwiec, 2026.
# Autorskie prawa osobiste (prawo do autorstwa) niezbywalne — art. 16 pr. aut.
# Nie usuwać tej informacji przy kopiowaniu ani modyfikacji pliku.
# ======================================================================
# Profil DECLARED — deklarowana tożsamość: ADR-0003 (granice zaufania, limiter)
# + ADR-0005 (deklarowany departament). Szczegóły: docs/deklaracja-runbook.md.
#
# Bezpieczny default = zachowanie identyczne z dotychczasowym: nasłuch tylko na
# loopbacku (server.address z application.yml) i puste allowed-cidrs. Otwarcie
# na sieć jednostki wymaga DWÓCH świadomych zmian w tym pliku:
#
#   1) server.address — na adres LAN serwera (albo 0.0.0.0),
#   2) portal.security.declared.allowed-cidrs — zakres stacji roboczych.
#
# Jeden przełącznik bez drugiego nie otwiera niczego: filtr odrzuca deklaracje
# spoza zaufanych zakresów (401), nawet jeśli port jest osiągalny.
#
# server:
#   address: 0.0.0.0

portal:
  security:
    declared:
      # PUSTE = deklaracje wyłącznie z loopbacku. Przykład otwarcia:
      # allowed-cidrs:
      #   - 10.20.0.0/16
      allowed-cidrs: []
      # Sufit żądań z jednego adresu (okno 1 min) — liczy /api ORAZ pliki /apps (strażnik,
      # ADR-0007). 120 = 2/s — z zapasem dla przeglądarki, za mało dla pętli w skrypcie.
      max-requests-per-minute: 120
      # Detekcja podszywania: więcej RÓŻNYCH loginów z jednego adresu w oknie
      # niż poniższy próg => blokada adresu na block-duration + 429 w audycie.
      # Przy tożsamości z NTLM (ADR-0006) to głównie fałszywe alarmy (RDS, wspólna stacja,
      # testy kilkoma kontami) — nadpisanie w config\application-declared.yml na serwerze.
      anomaly-distinct-logins: 3
      anomaly-window: 10m
      block-duration: 15m
      # Nagłówek z departamentem: w produkcji wpisuje go moduł IIS v3.0 z pierwszego
      # OU w AD (np. dzi/dag/dpb, małe litery) — ADR-0005 + ADR-0008; w dev deklaracja.
      dept-header: X-Auth-Dept

  # Strażnik modułów (ADR-0007): katalog bazowy /apps NA ZEWNĄTRZ witryny IIS.
  # Pierwszy segment URL-a pod /apps/ = podkatalog = code kafelka w tile_permissions.
  apps:
    base-dir: D:/portal/apps
